<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBloom | Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
      <h1>Task<span>Bloom</span></h1>
      <p class="subtitle">Small steps. Real progress.</p>
    </header>

    <section class="panel" aria-label="Add a task">
      <form id="task-form" class="add-row">
        <label class="visually-hidden" for="title">Task title</label>
        <input id="title" type="text" placeholder="What needs to get done?" autocomplete="off" maxlength="120">
        <label class="visually-hidden" for="status">Initial status</label>
        <select id="status">
          <option value="todo">To do</option>
          <option value="in-progress">In progress</option>
          <option value="done">Done</option>
        </select>
        <button class="add-button" id="add" type="submit">+ Add task</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="task-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR LIST</p>
          <h2>Tasks <span id="task-count" class="count">0</span></h2>
        </div>
        <p class="hint">Choose a filter to focus.</p>
      </div>
      <nav id="chips" class="filters" aria-label="Filter tasks">
        <button class="filter active" data-filter="all" type="button">All</button>
        <button class="filter" data-filter="todo" type="button">To do</button>
        <button class="filter" data-filter="in-progress" type="button">In progress</button>
        <button class="filter" data-filter="done" type="button">Done</button>
      </nav>
      <ul id="list" class="task-list" aria-live="polite"></ul>
      <div id="empty" class="empty-state">
        <div class="empty-icon">✦</div>
        <h3>No tasks here yet</h3>
        <p>Add a task above and make today count.</p>
      </div>
    </section>
    <footer>Made for progress, one task at a time.</footer>
  </main>
</body>
</html>
